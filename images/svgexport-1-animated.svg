<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23.548 16" width="23.548" height="16" aria-hidden="true">
  <style>
    .wave{fill:#000;transform-box:view-box;transform-origin:center;animation:wave-in 2.4s ease-out infinite}
    .wave-left-inner,.wave-right-inner{animation-delay:.35s}
    .wave-left-outer,.wave-right-outer{animation-delay:.7s}
    .dot{fill:#000}
    @keyframes wave-in{0%,12%{opacity:.18;transform:scale(.72)}35%,62%{opacity:1;transform:scale(1)}82%,100%{opacity:.18;transform:scale(.72)}}
    @media (prefers-reduced-motion:reduce){.wave{animation:none;opacity:1;transform:none}}
  </style>
